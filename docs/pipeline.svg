<svg viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9Z" fill="#64748b"/>
    </marker>
    <filter id="sf" x="-2%" y="-6%" width="104%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="880" height="320" fill="#f8fafc" rx="8"/>
  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">NeuroTrack — Two-Stage Track Reconstruction Pipeline</text>

  <!-- Stage 1: Embedding -->
  <rect x="16" y="44" width="420" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" filter="url(#sf)"/>
  <text x="36" y="64" font-size="10" font-weight="700" fill="#1d4ed8" letter-spacing="1">STAGE 1: METRIC LEARNING</text>

  <rect x="30" y="78" width="120" height="70" rx="7" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Raw Hits</text>
  <text x="90" y="116" text-anchor="middle" font-size="9" fill="#64748b">24-D features</text>
  <text x="90" y="130" text-anchor="middle" font-size="9" fill="#64748b">(x, y, z, volume...)</text>

  <line x1="150" y1="113" x2="168" y2="113" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="175" y="78" width="120" height="70" rx="7" fill="white" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="235" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">HitEmbedNet</text>
  <text x="235" y="114" text-anchor="middle" font-size="9" fill="#64748b">4-layer MLP</text>
  <text x="235" y="128" text-anchor="middle" font-size="9" fill="#64748b">LayerNorm + GELU</text>
  <text x="235" y="142" text-anchor="middle" font-size="9" fill="#64748b">~50K params</text>

  <line x1="295" y1="113" x2="313" y2="113" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="320" y="78" width="105" height="70" rx="7" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="372" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Embeddings</text>
  <text x="372" y="116" text-anchor="middle" font-size="9" fill="#64748b">12-D, L2-norm</text>
  <text x="372" y="130" text-anchor="middle" font-size="9" fill="#64748b">Hinge loss</text>

  <!-- Stage 2: GNN -->
  <rect x="445" y="44" width="420" height="120" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="1" filter="url(#sf)"/>
  <text x="465" y="64" font-size="10" font-weight="700" fill="#92400e" letter-spacing="1">STAGE 2: EDGE CLASSIFICATION</text>

  <rect x="458" y="78" width="105" height="70" rx="7" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="510" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">KNN Graph</text>
  <text x="510" y="116" text-anchor="middle" font-size="9" fill="#64748b">k=8 neighbours</text>
  <text x="510" y="130" text-anchor="middle" font-size="9" fill="#64748b">(2, E) edges</text>

  <line x1="563" y1="113" x2="581" y2="113" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="588" y="78" width="130" height="70" rx="7" fill="white" stroke="#ef4444" stroke-width="1.5"/>
  <text x="653" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">Interaction Net</text>
  <text x="653" y="112" text-anchor="middle" font-size="9" fill="#64748b">8 message-passing</text>
  <text x="653" y="126" text-anchor="middle" font-size="9" fill="#64748b">iterations</text>
  <text x="653" y="140" text-anchor="middle" font-size="9" fill="#64748b">Focal BCE loss</text>

  <line x1="718" y1="113" x2="736" y2="113" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="743" y="78" width="110" height="70" rx="7" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="798" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Edge Scores</text>
  <text x="798" y="116" text-anchor="middle" font-size="9" fill="#64748b">Per-edge logit</text>
  <text x="798" y="130" text-anchor="middle" font-size="9" fill="#64748b">same particle?</text>

  <!-- Arrow from Stage 1 to Stage 2 -->
  <line x1="425" y1="113" x2="445" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Stage 3: Post-processing -->
  <rect x="16" y="184" width="848" height="120" rx="10" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1" filter="url(#sf)"/>
  <text x="36" y="204" font-size="10" font-weight="700" fill="#9d174d" letter-spacing="1">POST-PROCESSING: TRACK BUILDING</text>

  <rect x="30" y="218" width="140" height="70" rx="7" fill="white" stroke="#ec4899" stroke-width="1.5"/>
  <text x="100" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#9d174d">Threshold</text>
  <text x="100" y="256" text-anchor="middle" font-size="9" fill="#64748b">Keep edges > 0.7</text>
  <text x="100" y="270" text-anchor="middle" font-size="9" fill="#64748b">score cutoff</text>

  <line x1="170" y1="253" x2="195" y2="253" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="202" y="218" width="160" height="70" rx="7" fill="white" stroke="#ec4899" stroke-width="1.5"/>
  <text x="282" y="238" text-anchor="middle" font-size="11" font-weight="600" fill="#9d174d">Connected Comp.</text>
  <text x="282" y="254" text-anchor="middle" font-size="9" fill="#64748b">Union-Find on</text>
  <text x="282" y="268" text-anchor="middle" font-size="9" fill="#64748b">surviving edges</text>

  <line x1="362" y1="253" x2="387" y2="253" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="394" y="218" width="155" height="70" rx="7" fill="white" stroke="#ec4899" stroke-width="1.5"/>
  <text x="471" y="238" text-anchor="middle" font-size="11" font-weight="600" fill="#9d174d">Kalman Filter</text>
  <text x="471" y="254" text-anchor="middle" font-size="9" fill="#64748b">Helix fit (optional)</text>
  <text x="471" y="268" text-anchor="middle" font-size="9" fill="#64748b">Chi² outlier rejection</text>

  <line x1="549" y1="253" x2="574" y2="253" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="581" y="218" width="130" height="70" rx="7" fill="white" stroke="#ec4899" stroke-width="1.5"/>
  <text x="646" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#9d174d">Arbitration</text>
  <text x="646" y="256" text-anchor="middle" font-size="9" fill="#64748b">Resolve shared</text>
  <text x="646" y="270" text-anchor="middle" font-size="9" fill="#64748b">hits between tracks</text>

  <line x1="711" y1="253" x2="736" y2="253" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="743" y="218" width="110" height="70" rx="7" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="798" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Tracks</text>
  <text x="798" y="262" text-anchor="middle" font-size="9" fill="#64748b">TrackML score</text>
  <text x="798" y="276" text-anchor="middle" font-size="9" fill="#64748b">evaluated</text>

  <!-- Arrow from Edge Scores down to Post-processing -->
  <path d="M 798 148 L 798 170 L 100 170 L 100 218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
